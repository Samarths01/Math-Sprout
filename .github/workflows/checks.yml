name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node -v
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          APP_BUILD_SHA: ci-build-sha
          DATABASE_PATH: ./data/ci.sqlite
          COOKIE_SECURE: "false"
